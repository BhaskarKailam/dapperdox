name: Build DapperDox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Fix broken dependency case issue
      - name: Fix GoConvey dependency
        run: |
          go mod init dapperdox || true
          go mod edit -replace github.com/smartystreets/GoConvey=github.com/smartystreets/goconvey@v1.8.1

      # Download dependencies
      - name: Download dependencies
        run: go mod tidy

      # Build
      - name: Build project
        run: go build -o dapperdox.exe .

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dapperdox-exe
          path: dapperdox.exe
