name: Build DapperDox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 🔥 Fix GoConvey conflict permanently
      - name: Fix dependency conflict
        run: |
          go mod init dapperdox || true

          go mod edit -replace github.com/smartystreets/GoConvey=github.com/smartystreets/goconvey@v1.8.1

          go mod edit -replace github.com/smartystreets/goconvey=github.com/smartystreets/goconvey@v1.8.1

      # ⚠️ IMPORTANT: avoid test-only dependency failure
      - name: Download dependencies (ignore test issues)
        run: go mod tidy -e

      # Build only main binary (skip tests)
      - name: Build project
        run: go build -tags netgo -o dapperdox.exe .

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dapperdox-exe
          path: dapperdox.exe
