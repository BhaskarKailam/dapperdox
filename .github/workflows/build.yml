name: Build DapperDox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      GO111MODULE: off

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Build project (GOPATH mode)
      - name: Build project
        run: go build -o dapperdox.exe .

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dapperdox-exe
          path: dapperdox.exe
