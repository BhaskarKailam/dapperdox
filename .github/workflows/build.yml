name: Build DapperDox

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Initialize modules (if missing)
        run: |
          if (-not (Test-Path go.mod)) {
            go mod init dapperdox
          }

      - name: Download dependencies
        run: go mod tidy

      - name: Build project
        run: go build -o dapperdox.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dapperdox-exe
          path: dapperdox.exe
